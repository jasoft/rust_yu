[workspace]
members = ["src-tauri"]
resolver = "2"

[patch.crates-io]
# tauri-winres 0.3.5 通过 embed-resource 调用 windres，但该路径不支持
# ARM64 GNU 的 pe-aarch64-little；本地补丁使用 LLVM Resource 工具链生成
# ARM64 COFF 资源，同时保持其他目标继续走上游实现。
tauri-winres = { path = "vendor/tauri-winres" }

[package]
name = "rust-yu"
version = "0.1.3"
edition = "2021"
authors = ["John Anders"]
description = "Rust Yu core uninstall and cleanup engine"
license = "MIT"

[dependencies]

# Windows API
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
] }

# 注册表操作
winreg = "0.55.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 异步
async-trait = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "signal",
    "sync",
    "time",
] }

# 文件系统
walkdir = "2.5"
glob = "0.3"

# 序列化/模板
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
askama = "0.12"
chrono = { version = "0.4", features = ["serde"] }

# 其他工具
thiserror = "1.0"
anyhow = "1.0"
dirs = "5.0"
regex = "1.10"
fuzzy-matcher = "0.3"
uuid = { version = "1.0", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"

[lib]
name = "rust_yu_lib"
path = "src/lib.rs"
crate-type = ["lib"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true



